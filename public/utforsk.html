<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee">
<title>FORMLÆRE — interaktiv traktat</title>
<style>html,body{margin:0;background:#f5f3ee;color:#171714;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#loading{min-height:70vh;display:grid;place-items:center;padding:32px;text-align:center}small{color:#6c6a62}</style>
<div id="loading"><div><div style="font-family:Georgia,serif;font-size:36px;letter-spacing:.06em">FORMLÆRE</div><small>åpner traktaten …</small></div></div>
<script>
fetch('https://raw.githubusercontent.com/lukketsvane/iverfinne.no/main/traktat/index.html',{cache:'no-store'})
 .then(r=>{if(!r.ok) throw new Error(String(r.status)); return r.text()})
 .then(html=>{document.open();document.write(html);document.close()})
 .catch(()=>{document.getElementById('loading').innerHTML='<div><div style="font-family:Georgia,serif;font-size:32px">FORMLÆRE</div><p>Utforskeren kunne ikke lastes akkurat nå.</p></div>'})
</script>
